<text x="164" y="222" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="26" font-weight="900" fill="#F0F0F0">项目背景</text>
<text x="112" y="268" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="18" fill="#9DB2B0">依托相关政策与行业标准，明确建设目标、范围与约束</text>
<text x="112" y="296" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="18" fill="#9DB2B0">条件，覆盖规划、实施、验收、运营全流程。</text>
<rect x="650" y="160" width="540" height="220" rx="14" fill="url(#panelGrad)" stroke="#1F3A52" stroke-opacity="0.6" stroke-width="1"/><g transform="translate(680.0,193.0) scale(1.5833)" stroke="#00C060" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M12 12 m-9 0 a9 9 0 1 0 18 0 a9 9 0 1 0 -18 0 M12 12 m-5 0 a5 5 0 1 0 10 0 a5 5 0 1 0 -10 0 M12 11 a1 1 0 1 0 0.01 0 Z"/></g>
<text x="734" y="222" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="26" font-weight="900" fill="#F0F0F0">核心目标</text>
<text x="682" y="268" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="18" fill="#9DB2B0">从战略、组织、技术、数据、保障五大维度，构建可落</text>
<text x="682" y="296" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="18" fill="#9DB2B0">地、可衡量、可持续的推进体系。</text>
<rect x="80" y="400" width="540" height="220" rx="14" fill="url(#panelGrad)" stroke="#1F3A52" stroke-opacity="0.6" stroke-width="1"/><g transform="translate(110.0,433.0) scale(1.5833)" stroke="#00C060" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6 C4 3.8 7.6 2 12 2 S20 3.8 20 6 V18 C20 20.2 16.4 22 12 22 S4 20.2 4 18 Z M4 6 V12 C4 14.2 7.6 16 12 16 S20 14.2 20 12 V6 M4 12 V18 C4 20.2 7.6 22 12 22 S20 20.2 20 18 V12"/></g>
<text x="164" y="462" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="26" font-weight="900" fill="#F0F0F0">关键要素</text>
<text x="112" y="508" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="18" fill="#9DB2B0">涵盖核心业务对象、关键流程节点与重要资产，确保全</text>
<text x="112" y="536" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="18" fill="#9DB2B0">生命周期可控、可追溯。</text>
<rect x="650" y="400" width="540" height="220" rx="14" fill="url(#panelGrad)" stroke="#1F3A52" stroke-opacity="0.6" stroke-width="1"/><g transform="translate(680.0,433.0) scale(1.5833)" stroke="#00C060" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12 L10 17 L19 7"/></g>
<text x="734" y="462" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="26" font-weight="900" fill="#F0F0F0">预期成效</text>
<text x="682" y="508" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="18" fill="#9DB2B0">达成既定质量、进度与要求，规避延期、超支与重大风</text>
<text x="682" y="536" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="18" fill="#9DB2B0">险，实现预期价值。</text>

